name: Build TyreTrack Windows - SciPy Fixed

on:
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install CPU PyTorch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install application dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate imports and GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_test.py
      - name: Test YOLO tracking before packaging
        run: python tracking_smoke_test.py
      - name: Build portable Windows application
        run: python -m PyInstaller --noconfirm --clean TyreTrack.spec
      - name: Copy detector model
        shell: pwsh
        run: Copy-Item tyre_detector.pt dist/TyreTrack/tyre_detector.pt
      - name: Test TRACKING INSIDE the packaged EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & 'dist/TyreTrack/TyreTrack.exe' --self-test-tracking
          if ($LASTEXITCODE -ne 0) { throw "Packaged tracker failed with exit code $LASTEXITCODE" }
      - name: Test packaged GUI stays open
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path 'dist/TyreTrack/TyreTrack.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "Packaged GUI exited unexpectedly with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: TyreTrack-V4.8.2-SciPy-Fixed-Windows
          path: dist/TyreTrack/
          if-no-files-found: error
          retention-days: 14
